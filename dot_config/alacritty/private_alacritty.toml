general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[terminal]
osc52 = "CopyPaste"

[window]
dimensions = { columns = 250, lines = 50 }
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.90
blur = true                     # KDE/macOS only

[scrolling]
history = 50000

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
bindings = [{ mouse = "Right", action = "Paste" }]

[keyboard]
bindings = [
  { key = "N",      mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "Return", mods = "Shift",         chars = "\u001b\r" },
]

# Default URL hint (re-declared because custom hints replace the defaults)
[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

# Copy md5 / sha1 / sha256 hashes
[[hints.enabled]]
regex = "(?-u:\\b)[0-9a-fA-F]{32,64}(?-u:\\b)"
action = "Copy"
post_processing = false
binding = { key = "H", mods = "Control|Shift" }
